        def lines = logFile.readLines('UTF-8')
        def problems = []
        lines.findAll { it.contains('BWR WORLDGEN CHECK') }.each { logger.lifecycle(it.replaceFirst(/^\[[^\]]*\] \[[^\]]*\] \[[^\]]*\]: /, '')) }
        if (!lines.any { it.contains('BWR WORLDGEN CHECK: PASS') }) problems << 'no "BWR WORLDGEN CHECK: PASS" line'
        def ours = ~/dev\.bwr|\[bwr\]|\[BWR|bwr\//
        def badText = ~/NoClassDefFoundError|ClassNotFoundException|Missing registry|Failed to load|Couldn't load|Exception in thread|Detected setBlock in a far chunk/
        lines.each { l ->
