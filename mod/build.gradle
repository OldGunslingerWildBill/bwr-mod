    exclude 'data/bwrcavity/**'
    exclude 'data/bwrcrane/**'
    exclude 'data/bwrheight/**'
    exclude 'data/bwrinternals/**'
    exclude 'data/bwrrwcu/**'
    exclude 'data/bwrshell/**'
    exclude 'data/bwraux/**'
    exclude 'data/bwrhx/**'
