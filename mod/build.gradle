// ---------------------------------------------------------------------------
// :mod:runSaveCompatCheck [-PbwrSaveWorld=<folder of a world saved by an older build>] [-PbwrNoCC]  (default: the committed
// alpha.40 fixture, mod/src/test-worlds/alpha40, see its README.txt)
// Copies that world (never written to; refuses anything inside the Modrinth profile, which is the owner's own game) to
// run/saveCompatCheck/world, boots a dedicated server on the copy and lets dev.bwr.mod.devtest.SaveCompatCheck compare the
// loaded world with the raw region files: block ids and states, block entity data (panel components and bindings, wrench
// bindings, reactor/pump state), player item stacks, and again after 100 ticks. Fails the build unless the log holds
// "BWR SAVE COMPAT CHECK: PASS" and no ERROR line from the mod or about a missing class. Detail:
// mod/run/saveCompatCheck/save-compat-report.txt.
// ---------------------------------------------------------------------------
tasks.matching { it.name == 'runSaveCompatCheck' }.configureEach { task ->
    task.doFirst {
        def src = file(project.findProperty('bwrSaveWorld')?.toString() ?: 'src/test-worlds/alpha40')
        if (!new File(src, 'level.dat').isFile()) throw new GradleException("${src} is not a world folder (no level.dat)")
        if (src.absolutePath.toLowerCase().contains('modrinthapp')) {
            throw new GradleException("Refusing to read ${src}: copy the owner's world to a scratch folder first")
        }
        def dir = neoForge.runs.getByName('saveCompatCheck').gameDirectory.get().asFile
        project.delete(dir)
        dir.mkdirs()
        copy {
            from src
            into new File(dir, 'world')
            exclude 'session.lock'
        }
        new File(dir, 'eula.txt').text = 'eula=true' + System.lineSeparator()
        new File(dir, 'server.properties').text = ['online-mode=false', 'server-ip=127.0.0.1', 'server-port=25597',
                'level-name=world', 'spawn-monsters=false', 'spawn-animals=false', 'spawn-npcs=false', 'view-distance=4',
                'simulation-distance=4', 'max-tick-time=-1', 'motd=BWR save compat check'].join(System.lineSeparator()) + System.lineSeparator()
    }
    task.doLast {
        def dir = neoForge.runs.getByName('saveCompatCheck').gameDirectory.get().asFile
        def lines = new File(dir, 'logs/latest.log').readLines('UTF-8')
        def problems = []
        lines.findAll { it.contains('BWR SAVE COMPAT CHECK') }.each { logger.lifecycle(it.replaceFirst(/^\[[^\]]*\] \[[^\]]*\] \[[^\]]*\]: /, '')) }
        if (!lines.any { it.contains('BWR SAVE COMPAT CHECK: PASS') }) problems << 'no "BWR SAVE COMPAT CHECK: PASS" line'
        def ours = ~/dev\.bwr|\[bwr\]|\[BWR|bwr\//
        def badText = ~/NoClassDefFoundError|ClassNotFoundException|Missing registry|Failed to load|Couldn't load|Skipping BlockEntity|Exception in thread/
        lines.each { l ->
            if (l.contains('SAVE COMPAT CHECK: PROBLEM') || l.contains('SAVE COMPAT CHECK: FAIL')) return
            if (l.contains('/ERROR]') && (l =~ ours || l =~ badText)) problems << 'ERROR: ' + l.trim()
            else if (l =~ badText) problems << 'bad text: ' + l.trim()
        }
        if (problems) throw new GradleException('saveCompatCheck FAILED:' + System.lineSeparator() + '  ' + problems.unique().take(60).join(System.lineSeparator() + '  ') + System.lineSeparator() + '  (details: ' + new File(dir, 'save-compat-report.txt') + ')')
        logger.lifecycle('saveCompatCheck: PASS')
    }
}

// ---------------------------------------------------------------------------
// :mod:runTurbineGameTest keeps its world between runs (run/turbineGameTest/world) so the fixtures find the previous
// run's blocks, and that world also keeps every ItemEntity a fixture left behind: a fixture that clears a reactor
// pops each loaded fuel assembly (ReactorControllerBlock.onRemove), the chunk unloads and the items are saved, and
// the next run force-loads the chunk and ticks them again. They despawn only after 6000 ticks of being loaded, which
// is about thirty runs, so a long-lived run directory ends up with tens of thousands of items in the force-loaded
// fixture chunks; each one's collision check scans its whole section, the server tick goes quadratic and the 'fcd'
// batch (11 s in a young world) takes seven minutes. No test relies on an entity surviving from an earlier run, so the
// stored entities are dropped before the server starts (blocks, chunk tickets and level data stay).
// ---------------------------------------------------------------------------
tasks.matching { it.name == 'runTurbineGameTest' }.configureEach { task ->
    task.doFirst {
        def entities = new File(neoForge.runs.getByName('turbineGameTest').gameDirectory.get().asFile, 'world/entities')
        if (entities.isDirectory()) {
            entities.deleteDir()
            logger.lifecycle('turbineGameTest: stored entities of earlier runs removed (world/entities)')
        }
    }
}

// ---------------------------------------------------------------------------
// C3: :mod:runMultiplayerCheck. One Gradle invocation that starts a real dedicated server (run/mpServer, offline mode,
// 127.0.0.1:25599, a flat world made fresh each time, spawn protection off), waits for it to listen, starts two real
// game clients (BwrTesterA and BwrTesterB, their own game directories, quick-play into the server), and waits for the
// verdict the server writes. The server conducts the scenarios (MpServerCheck), the clients act through the real
// connection (MpClientCheck). Phase 1 ends with the server stopping itself; the driver then starts it again on the same
// world (phase 2) while the clients reconnect, to prove what persists. Fails the build on MP CHECK FAIL, a dead process
// or a timeout. Logs and screenshots: mod/run/mp-check/, mod/run/mpClientA|B/mp-check/. The render-mod properties
// (-PbwrRenderMods, -PbwrShaderPack) apply to both clients, so the same check can be run under Sodium/Iris.
// ---------------------------------------------------------------------------
tasks.register('runMultiplayerCheck') {
    group = 'verification'
    description = 'Dedicated server plus two real clients on localhost: panels, FCD, rod select matrix, items, rejoin, restart.'
    ['runMpServer', 'runMpClientA', 'runMpClientB'].each { n ->
        dependsOn({ tasks.getByName(n).taskDependencies })
    }
    doLast {
        def mpDir = file('run/mp-check')
        def serverDir = file('run/mpServer')
        project.delete(mpDir, serverDir)
        mpDir.mkdirs()
        serverDir.mkdirs()
        new File(serverDir, 'eula.txt').text = 'eula=true\n'
        new File(serverDir, 'server.properties').text = [
                'online-mode=false', 'server-ip=127.0.0.1', 'server-port=25599', 'spawn-protection=0',
                'gamemode=survival', 'force-gamemode=true', 'difficulty=peaceful', 'level-type=minecraft\\:flat',
                'generator-settings={"layers":[{"block":"minecraft:bedrock","height":1}],"biome":"minecraft:plains","structure_overrides":[]}',
                'generate-structures=false', 'spawn-monsters=false', 'spawn-animals=false', 'spawn-npcs=false',
                'allow-flight=true', 'max-tick-time=-1', 'view-distance=8', 'simulation-distance=8',
                'enforce-secure-profile=false', 'enable-command-block=false', 'player-idle-timeout=0',
                'motd=BWR multiplayer check'].join('\n') + '\n'
        ['mpClientA', 'mpClientB'].each { prepareRenderMods(neoForge.runs.getByName(it).gameDirectory.get().asFile) }

        def launch = { String runName, String tag ->
            def t = tasks.getByName('run' + runName.capitalize())
            def gameDir = neoForge.runs.getByName(runName).gameDirectory.get().asFile
            gameDir.mkdirs()
            t.environment.putAll(t.environmentProperty.get())
            t.classpath(t.classpathProvider)
            t.workingDir = gameDir
            def log = new File(mpDir, tag + '.log')
            // JavaExec only puts its executable, class path and main class together when it runs. This is what it would run:
            // the toolchain's java, the JVM arguments (which include the -D properties and MDG's VM argument file), the class
            // path, the main class and the program arguments (MDG's argument file).
            def command = [t.javaLauncher.get().executablePath.asFile.absolutePath]
            command.addAll(t.jvmArgs)
            t.allJvmArgs.each { if (!command.contains(it)) command.add(it) }
            command.addAll(['-cp', t.classpath.asPath, t.mainClass.get()])
            command.addAll(t.args)
            def pb = new ProcessBuilder(command).directory(gameDir).redirectErrorStream(true).redirectOutput(log)
            t.environment.each { k, v -> pb.environment().put(k.toString(), v.toString()) }
            logger.lifecycle("multiplayer check: starting ${tag} (log ${log})")
            [process: pb.start(), log: log, tag: tag, done: false]
        }
        def alive = { p -> p.process.isAlive() }
        def logHas = { p, text -> p.log.isFile() && p.log.text.contains(text) }
        def procs = []
        def stopAll = { procs.each { if (it.process.isAlive()) it.process.destroyForcibly() } }
        long started = System.currentTimeMillis()
        def elapsed = { (System.currentTimeMillis() - started) / 1000 }
        def readResult = {
            def f = new File(mpDir, 'result.properties')
            if (!f.isFile()) return null
            def props = new Properties()
            f.withInputStream { props.load(it) }
            props.getProperty('result')
        }
        def waitFor = { String what, int seconds, Closure condition ->
            long until = System.currentTimeMillis() + seconds * 1000L
            while (!condition()) {
                if (System.currentTimeMillis() > until) throw new GradleException("multiplayer check: timed out waiting for ${what}")
                Thread.sleep(500)
            }
        }
        try {
            def server = launch('mpServer', 'server-1')
            procs << server
            waitFor('the server to listen', 400) { logHas(server, 'Done (') || !alive(server) }
            if (!alive(server)) throw new GradleException("multiplayer check: the server died while starting, see ${server.log}")
            def clientA = launch('mpClientA', 'clientA')
            procs << clientA
            Thread.sleep(6000)
            def clientB = launch('mpClientB', 'clientB')
            procs << clientB
            def phase1Done = false
            while (true) {
                def result = readResult()
                if (result != null) {
                    if (result == 'MP CHECK PHASE 1 DONE' && !phase1Done) {
                        phase1Done = true
                        logger.lifecycle("multiplayer check: phase 1 passed after ${elapsed()} s; restarting the server")
                        waitFor('the server to stop', 120) { !alive(server) }
                        new File(mpDir, 'result.properties').delete()
                        server = launch('mpServer', 'server-2')
                        procs << server
                        waitFor('the restarted server to listen', 400) { logHas(server, 'Done (') || !alive(server) }
                        continue
                    }
                    if (result.startsWith('MP CHECK PASS')) {
                        logger.lifecycle("MP CHECK PASS (${elapsed()} s)")
                        waitFor('the clients and the server to close', 90) { !alive(clientA) && !alive(clientB) && !alive(server) }
                        break
                    }
                    throw new GradleException(result + " (see ${mpDir} and the clients' mp-check folders)")
                }
                if (!alive(server)) throw new GradleException("multiplayer check: the server exited (code ${server.process.exitValue()}) without a verdict, see ${server.log}")
                if (!alive(clientA)) throw new GradleException("multiplayer check: client A exited (code ${clientA.process.exitValue()}) without a verdict, see ${clientA.log}")
                if (!alive(clientB)) throw new GradleException("multiplayer check: client B exited (code ${clientB.process.exitValue()}) without a verdict, see ${clientB.log}")
                if (elapsed() > 1500) throw new GradleException('multiplayer check: no verdict after 25 minutes')
                Thread.sleep(1000)
            }
        } finally {
            stopAll()
        }
    }
}

