// NeoForge mod module. Depends on :core for all physics.
// Current licensing: ../LICENSE. Earlier MPL-2.0 grants remain valid.
plugins {
    id 'net.neoforged.moddev' version '2.0.143'
}

group = project.property('group')
version = project.property('version')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.property('javaVersion') as int)
    }
}

neoForge {
    version = project.property('neoforgeVersion')

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client { client() }
        server { server() }
        refuellingCheck {
            client()
            gameDirectory = file('run/refuellingCheck')
            programArguments.addAll('--width', '1280', '--height', '900')
            jvmArguments.add('-Dbwr.refuellingCheck=true')
        }
        reactorFitCheck {
            client()
            gameDirectory = file('run/reactorFitCheck')
            programArguments.addAll('--width', '1280', '--height', '900')
            jvmArguments.add('-Dbwr.reactorFitCheck=true')
        }
        data { data() }
        turbineGameTest {
            type = 'gameTestServer'
            gameDirectory = file('run/turbineGameTest')
            // 'bwrpool' holds the spent fuel pool tests (SpentFuelPoolTests); -PbwrOnlyPool runs just those.
            // 'bwrtick' holds the tick-cost and chunk-boundary tests (TickBudgetTests, ChunkLinkTests, ...); -PbwrOnlyTick
            // runs just those, in about a minute, while they are being developed. The default runs everything.
            // 'bwrblast' holds the accident blast tests (AccidentBlastTests); -PbwrOnlyBlast runs just those.
            // 'bwruranium' is the uranium ore tests (UraniumOreTests); -PbwrOnlyUranium runs just those.
            // 'bwrplant' holds the plant computer tests (PlantComputerTests); -PbwrOnlyPlant runs just those.
            // 'bwrbridge' holds the refuelling bridge tests (RefuellingBridgeTests); -PbwrOnlyBridge runs just those.
            // 'bwrinternals' holds the steam dryer and separator tests (VesselInternalsTests); -PbwrGameTestNamespaces=bwrinternals runs just those.
            // 'bwrheight' holds the vessel height tests (VesselHeightTests); -PbwrGameTestNamespaces=bwrheight runs just those.
            // 'bwraux' holds the turbine auxiliary tests (TurbineAuxTests); -PbwrGameTestNamespaces=bwraux runs just those.
            // 'bwrcavity' holds the cavity seal and reactor well tests (CavitySealTests, CavityDrainTests, WaterValveTests); -PbwrOnlyCavity runs just those.
            // 'bwrshell' holds the shell-and-tube exchanger and outlet chute tests (ShellExchangerTests); -PbwrGameTestNamespaces=bwrshell runs just those.
            // 'bwrhx' holds the full-size multiblock RHR heat exchanger tests (HxMultiblockTests); -PbwrGameTestNamespaces=bwrhx runs just those.
            // 'bwrcrane' holds the reactor building crane, stud tensioner and head stand tests (BuildingCraneTests); -PbwrOnlyCrane runs just those.
            // 'bwrrtg' holds the RTG and isotope separator tests (RtgTests); -PbwrGameTestNamespaces=bwrrtg runs just those.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.hasProperty('bwrGameTestNamespaces') ? project.property('bwrGameTestNamespaces') : (project.hasProperty('bwrOnlyTick') ? 'bwrtick' : project.hasProperty('bwrOnlyPlant') ? 'bwrplant' : project.hasProperty('bwrOnlyPool') ? 'bwrpool' : project.hasProperty('bwrOnlyUranium') ? 'bwruranium' : project.hasProperty('bwrOnlyBlast') ? 'bwrblast' : project.hasProperty('bwrOnlyBridge') ? 'bwrbridge' : project.hasProperty('bwrOnlyCavity') ? 'bwrcavity' : project.hasProperty('bwrOnlyCrane') ? 'bwrcrane' : 'bwr,bwrtick,bwrplant,bwrpool,bwruranium,bwrblast,bwrbridge,bwrcavity,bwrinternals,bwrcrane,bwrheight,bwrrwcu,bwrshell,bwraux,bwrhx,bwrrtg')
            // Developer-only tick profiler (dev.bwr.mod.TickProbe): per-system microseconds per server tick, printed by
            // the TickBudgetTests plant profile as "TICK PROBE" lines. Off (and costless) without this property.
            if (project.hasProperty('bwrTickProbe')) jvmArguments.add('-Dbwr.tickProbe=true')
            // -PbwrJfr=<file.jfr> records a Java Flight Recorder profile of the whole run (jfr print / summary read it).
            if (project.hasProperty('bwrJfr')) jvmArguments.add('-XX:StartFlightRecording=filename=' + project.property('bwrJfr') + ',settings=profile,dumponexit=true')
        }
        advancementClientCheck {
            client()
            gameDirectory = file('run/advancementClientCheck')
            programArguments.addAll('--width', '1280', '--height', '900')
            jvmArguments.add('-Dbwr.advancementClientCheck=true')
        }
        soundClientCheck {
            client()
            gameDirectory = file('run/soundClientCheck')
            jvmArguments.add('-Dbwr.soundClientCheck=true')
        }
        // Pictures of the recirculation pump, jet pumps and RIP (RecircRemodelClientCheck), saved in run/turbineModelCheck/recirc-remodel-check.
        recircRemodelCheck {
            client()
            gameDirectory = file('run/turbineModelCheck')
            programArguments.addAll('--width', '1920', '--height', '1080')
            jvmArguments.add('-Dbwr.recircRemodelCheck=true')
        }
        turbineModelCheck {
            client()
            gameDirectory = file('run/turbineModelCheck')
            programArguments.addAll('--width', '1920', '--height', '1080')
            jvmArguments.add('-Dbwr.turbineModelCheck=true')
            // Screenshots: 1920 x 1080 windowed, saved 2 x 2 supersampled (dev.bwr.mod.devtest.CheckShots). -PbwrNoShotAA saves the plain framebuffer.
            if (project.hasProperty('bwrNoShotAA')) jvmArguments.add('-Dbwr.noShotAA=true')
            if (project.hasProperty('bwrShotPlainCopy')) jvmArguments.add('-Dbwr.shotPlainCopy=true')
            if (project.hasProperty('bwrPumpPanelCheck')) jvmArguments.add('-Dbwr.pumpPanelCheck=true')
            if (project.hasProperty('bwrTerryPanelCheck')) jvmArguments.add('-Dbwr.terryPanelCheck=true')
            if (project.hasProperty('bwrPowerPanelCheck')) jvmArguments.add('-Dbwr.powerPanelCheck=true')
            if (project.hasProperty('bwrTurbineAuxCheck')) jvmArguments.add('-Dbwr.turbineAuxCheck=true')
            // The RTG and the isotope separator in the world and in their screens (RtgClientCheck): pictures in run/turbineModelCheck/rtg-check.
            if (project.hasProperty('bwrRtgClientCheck')) jvmArguments.add('-Dbwr.rtgClientCheck=true')
            if (project.hasProperty('bwrCondenserPanelCheck')) jvmArguments.add('-Dbwr.condenserPanelCheck=true')
            if (project.hasProperty('bwrCoolingPanelCheck')) jvmArguments.add('-Dbwr.coolingPanelCheck=true')
            // The cooling-tower remodel pictures (CoolingTowerShotsCheck): both towers with plume, fans, louvers, legs, distant LOD, into run/turbineModelCheck/cooling-tower-shots.
            if (project.hasProperty('bwrCoolingTowerShots')) jvmArguments.add('-Dbwr.coolingTowerShots=true')
            if (project.hasProperty('bwrCompactCorePanelCheck')) jvmArguments.add('-Dbwr.compactCorePanelCheck=true')
            if (project.hasProperty('bwrVesselModelCheck')) jvmArguments.add('-Dbwr.vesselModelCheck=true')
            if (project.hasProperty('bwrRvuCheck')) jvmArguments.add('-Dbwr.rvuCheck=true')
            // The v2 vessel's pictures: outside, head off, dryer and separators lifted by the bridge onto pads, all sizes (RpvRemodelClientCheck).
            if (project.hasProperty('bwrRpvRemodelCheck')) jvmArguments.add('-Dbwr.rpvRemodelCheck=true')
            if (project.hasProperty('bwrRvuAccidentCheck')) jvmArguments.addAll('-Dbwr.rvuCheck=true', '-Dbwr.rvuAccident=true')
            if (project.hasProperty('bwrRvuQuickCheck')) jvmArguments.addAll('-Dbwr.rvuCheck=true', '-Dbwr.rvuQuick=true')
            if (project.hasProperty('bwrGpuVisualsCheck')) jvmArguments.add('-Dbwr.gpuVisualsCheck=true')
            if (project.hasProperty('bwrGpuBenchmarkOnly')) jvmArguments.addAll('-Dbwr.coolingPanelCheck=true', '-Dbwr.gpuVisualsCheck=true', '-Dbwr.gpuBenchmarkOnly=true')
            if (project.hasProperty('bwrSuppressionPanelCheck')) jvmArguments.add('-Dbwr.suppressionPanelCheck=true')
            if (project.hasProperty('bwrTankPanelCheck')) jvmArguments.add('-Dbwr.tankPanelCheck=true')
            if (project.hasProperty('bwrSpentFuelPoolCheck')) jvmArguments.add('-Dbwr.spentFuelPoolCheck=true')
            if (project.hasProperty('bwrRefuellingBridgeCheck')) jvmArguments.add('-Dbwr.refuellingBridgeCheck=true')
            if (project.hasProperty('bwrCavityCheck')) jvmArguments.add('-Dbwr.cavityCheck=true')
            // The reactor building crane, the stud tensioner and the head stand: pictures in run/turbineModelCheck/building-crane-check (BuildingCraneClientCheck).
            if (project.hasProperty('bwrBuildingCraneCheck')) jvmArguments.add('-Dbwr.buildingCraneCheck=true')
            // The remodelled motor-driven pumps (LPCS, HPCS, RHR, motor feed, SLC pump and tank), three angles each: run/turbineModelCheck/motor-pump-shots (MotorPumpShots).
            if (project.hasProperty('bwrMotorPumpShots')) jvmArguments.add('-Dbwr.motorPumpShots=true')
            if (project.hasProperty('bwrAlphaClientCheck')) jvmArguments.add('-Dbwr.alphaClientCheck=true')
            if (project.hasProperty('bwrGridClientCheck')) jvmArguments.add('-Dbwr.gridClientCheck=true')
            if (project.hasProperty('bwrMimicClientCheck')) jvmArguments.add('-Dbwr.mimicClientCheck=true')
            if (project.hasProperty('bwrRecorderClientCheck')) jvmArguments.addAll('-Dbwr.recorderClientCheck=true', '-Dbwr.recorderTiming=true')
            if (project.hasProperty('bwrRecorderClientStages')) jvmArguments.add('-Dbwr.recorderClientStages=' + project.property('bwrRecorderClientStages'))
            if (project.hasProperty('bwrCreativePerformanceCheck')) jvmArguments.add('-Dbwr.creativePerformanceCheck=true')
            if (project.hasProperty('bwrGuiPerformanceCheck')) jvmArguments.add('-Dbwr.guiPerformanceCheck=true')
            if (project.hasProperty('bwrGuiPerformanceStages')) jvmArguments.add('-Dbwr.guiPerformanceStages=' + project.property('bwrGuiPerformanceStages'))
            if (project.hasProperty('bwrGuiPerformancePixels')) jvmArguments.add('-Dbwr.guiPerformancePixels=true')
            if (project.hasProperty('bwrJfr')) jvmArguments.add('-XX:StartFlightRecording=filename=' + project.property('bwrJfr') + ',settings=profile,dumponexit=true,jdk.ExecutionSample#period=1ms')
            if (project.hasProperty('bwrPanelClientCheck')) jvmArguments.add('-Dbwr.panelClientCheck=true')
            if (project.hasProperty('bwrSwitchInputSurvey')) jvmArguments.add('-Dbwr.switchInputSurvey=true')
            if (project.hasProperty('bwrPanelClientStages')) jvmArguments.add('-Dbwr.panelClientStages=' + project.property('bwrPanelClientStages'))
            if (project.hasProperty('bwrPanelFixtureModels')) jvmArguments.add('-Dbwr.panelFixtureModels=true')
            if (project.hasProperty('bwrContainmentClientCheck')) jvmArguments.add('-Dbwr.containmentClientCheck=true')
            if (project.hasProperty('bwrAccidentBlastCheck')) jvmArguments.add('-Dbwr.accidentBlastClientCheck=true')
            // One session with whatever else is in the run's mods/ folder (Essential, Effortless ...): builds and uses the new hardware.
            if (project.hasProperty('bwrCompatSessionCheck')) jvmArguments.add('-Dbwr.compatSessionCheck=true')
            // Door pictures for the old/new comparison: -PbwrContainmentDoorShots=<label> saves run/turbineModelCheck/containment-door-shots/<label>/.
            if (project.hasProperty('bwrContainmentDoorShots')) jvmArguments.add('-Dbwr.containmentDoorShots=' + project.property('bwrContainmentDoorShots'))
            if (project.hasProperty('bwrPanelPerformanceCheck')) jvmArguments.add('-Dbwr.panelPerformanceCheck=true')
            if (project.hasProperty('bwrPanelPerformanceStages')) jvmArguments.add('-Dbwr.panelPerformanceStages=' + project.property('bwrPanelPerformanceStages'))
            if (project.hasProperty('bwrPanelImmediate')) jvmArguments.add('-Dbwr.panelImmediate=true')
            if (project.hasProperty('bwrRenderProfile')) jvmArguments.add('-Dbwr.renderProfile=true')
            if (project.hasProperty('bwrFcdClientCheck')) jvmArguments.add('-Dbwr.fcdClientCheck=true')
            if (project.hasProperty('bwrFcdReadinessProbe')) jvmArguments.add('-Dbwr.fcdReadinessProbe=true')
            if (project.hasProperty('bwrFcdClientStages')) jvmArguments.add('-Dbwr.fcdClientStages=' + project.property('bwrFcdClientStages'))
            if (project.hasProperty('bwrFcdLegendsPerFrame')) jvmArguments.add('-Dbwr.fcdLegendCache=false')
            if (project.hasProperty('bwrFcdProcedural')) jvmArguments.add('-Dbwr.fcdKits=false')
            if (project.hasProperty('bwrMachineRenderCheck')) jvmArguments.add('-Dbwr.machineRenderCheck=true')
            // Turbine-driven pump pictures (feed pump turbine, RCIC, HPCI) with piped ports: -PbwrTurbinePumpShots=<label> saves run/turbineModelCheck/turbine-pump-shots/<label>/ (TurbinePumpShots).
            if (project.hasProperty('bwrTurbinePumpShots')) jvmArguments.add('-Dbwr.turbinePumpShots=' + project.property('bwrTurbinePumpShots'))
            if (project.hasProperty('bwrShellExchangerCheck')) jvmArguments.add('-Dbwr.shellExchangerCheck=true')
            if (project.hasProperty('bwrHxMultiblockCheck')) jvmArguments.add('-Dbwr.hxMultiblockCheck=true')
            if (project.hasProperty('bwrSpargerCheck')) jvmArguments.add('-Dbwr.spargerCheck=true')
            if (project.hasProperty('bwrCoreModelCheck')) jvmArguments.add('-Dbwr.coreModelCheck=true')
            if (project.hasProperty('bwrRipModelCheck')) jvmArguments.add('-Dbwr.ripModelCheck=true')
            if (project.hasProperty('bwrNetworkingClientCheck')) jvmArguments.add('-Dbwr.networkingClientCheck=true')
            if (project.hasProperty('bwrRwcuClientCheck')) jvmArguments.add('-Dbwr.rwcuClientCheck=true')
            if (project.hasProperty('bwrRadiationClientCheck')) jvmArguments.add('-Dbwr.radiationClientCheck=true')
            if (project.hasProperty('bwrFurnitureClientCheck')) jvmArguments.add('-Dbwr.furnitureClientCheck=true')
            if (project.hasProperty('bwrBoardClientCheck')) jvmArguments.add('-Dbwr.boardClientCheck=true')
            if (project.hasProperty('bwrBoardClientStages')) jvmArguments.add('-Dbwr.boardClientStages=' + project.property('bwrBoardClientStages'))
            if (project.hasProperty('bwrUraniumClientCheck')) jvmArguments.add('-Dbwr.uraniumClientCheck=true')
            if (project.hasProperty('bwrGuiScreenCheck')) jvmArguments.add('-Dbwr.guiScreenCheck=true')
            if (project.hasProperty('bwrGuiCheckLenient')) jvmArguments.add('-Dbwr.guiCheckLenient=true')
        }

        // Builds a reactor, a suppression pool and a turbine outlet in a real
        // world, looks their peripherals up through the real CC:Tweaked
        // capability, calls every @LuaFunction on both a formed and an
        // unformed plant, then halts the server. See
        // dev.bwr.mod.devtest.PeripheralRuntimeCheck. Inert without the
        // system property, and the whole devtest package is stripped from the
        // published jar below.
        peripheralCheck {
            server()
            gameDirectory = file('run/peripheralCheck')
            jvmArguments.add('-Dbwr.peripheralRuntimeCheck=true')
            programArguments.addAll('--nogui')
        }
        // Dedicated-server boot check (:mod:runServerBootCheck, verdict in the doLast block below). A fresh disposable
        // flat world each time; the JVM writes a class-load log so the verdict can see client classes on a server.
        serverBootCheck {
            server()
            gameDirectory = file('run/serverBootCheck')
            jvmArguments.addAll('-Dbwr.serverBootCheck=true',
                    '-Xlog:class+load:file=' + file('run/serverBootCheck-classload.log').absolutePath)
            programArguments.addAll('--nogui')
        }
        // Uranium worldgen check (:mod:runWorldgenCheck, verdict in the doLast block below): a dedicated server on a fresh
        // normal world plus the datapack in src/devtest-pack (one flat dimension per biome group) that generates chunks and
        // measures the uranium in them. See dev.bwr.mod.devtest.UraniumWorldgenCheck and URANIUM-ORE.md.
        worldgenCheck {
            server()
            gameDirectory = file('run/worldgenCheck')
            jvmArguments.add('-Dbwr.worldgenCheck=true')
            programArguments.addAll('--nogui')
        }
        // Old-save check (:mod:runSaveCompatCheck [-PbwrSaveWorld=<world folder>], see the doFirst/doLast block below).
        saveCompatCheck {
            server()
            gameDirectory = file('run/saveCompatCheck')
            jvmArguments.add('-Dbwr.saveCompat.source=' + file(project.findProperty('bwrSaveWorld')?.toString() ?: 'src/test-worlds/alpha40').absolutePath)
            programArguments.addAll('--nogui')
        }
        panelCcCheck {
            server()
            gameDirectory = file('run/panelCcCheck')
            jvmArguments.add('-Dbwr.panelCcCheck=true')
            programArguments.addAll('--nogui')
        }
        // C3: a real dedicated server and two real clients, driven by :mod:runMultiplayerCheck (see below and TESTING.md).
        // Everything is on 127.0.0.1; the world is a disposable flat world made by the driver.
        mpServer {
            server()
            gameDirectory = file('run/mpServer')
            jvmArguments.addAll('-Dbwr.mpCheck=server', '-Dbwr.mp.dir=' + file('run/mp-check').absolutePath)
            programArguments.addAll('--nogui')
        }
        mpClientA {
            client()
            gameDirectory = file('run/mpClientA')
            programArguments.addAll('--username', 'BwrTesterA', '--quickPlayMultiplayer', '127.0.0.1:25599', '--width', '960', '--height', '540')
            jvmArguments.addAll('-Dbwr.mpCheck=client', '-Dbwr.mp.name=A', '-Dbwr.mp.dir=' + file('run/mp-check').absolutePath)
        }
        mpClientB {
            client()
            gameDirectory = file('run/mpClientB')
            programArguments.addAll('--username', 'BwrTesterB', '--quickPlayMultiplayer', '127.0.0.1:25599', '--width', '960', '--height', '540')
            jvmArguments.addAll('-Dbwr.mpCheck=client', '-Dbwr.mp.name=B', '-Dbwr.mp.dir=' + file('run/mp-check').absolutePath)
        }
        luaExamplesCheck {
            server()
            gameDirectory = file('run/luaExamplesCheck')
            jvmArguments.add('-Dbwr.luaExamplesCheck=true')
            systemProperty 'bwr.luaExamplesDirectory', rootProject.file('docs/lua').absolutePath
            programArguments.addAll('--nogui')
        }
    }

    mods {
        bwr {
            sourceSet sourceSets.main
            // :core travels inside the mod jar as a jarJar nested jar, so in a
            // production install FML loads it as part of this mod. A dev run has
            // no nested jars: without this line the physics module lands on the
            // boot module path as a plain automatic module, the game layer
            // cannot see it, and the first registration-time reference to a
            // dev.bwr.core class dies with NoClassDefFoundError. Declaring it as
            // part of the mod puts it in the same layer in dev as in production.
            sourceSet project(':core').sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        // CC:Tweaked's own maven. Note the host: the older https://squiddev.cc/maven/
        // stops at the MC 1.21 branch (1.111.0), whose neoforge dependency range is
        // "[21.0.21-beta,21.1)" and therefore cannot load against the 21.1.248 this
        // project pins. maven.squiddev.cc carries the 1.21.1 branch.
        name = 'squiddev'
        url = 'https://maven.squiddev.cc/'
        content { includeGroup 'cc.tweaked' }
    }
    maven {
        name = 'modmaven'
        url = 'https://modmaven.dev/'
        // modmaven publishes bare jars with no POM alongside them, so Gradle has
        // to be told that the artifact itself is the only metadata it will find.
        // Without this it looks for a .pom, gets a 404, and fails resolution.
        metadataSources { artifact() }
        content { includeGroup 'mekanism' }
    }
}

dependencies {
    // Physics core travels with the mod jar.
    implementation project(':core')
    jarJar project(':core')

    // CC:Tweaked — NEVER bundled. Do not shade, do not vendor the API source, do
    // not add it to jarJar. IPeripheral.java is LicenseRef-CCPL and permits
    // redistribution only unmodified and in full. Players install CC:Tweaked.
    compileOnly "cc.tweaked:cc-tweaked-${project.property('ccTweakedMcBranch')}-core-api:${project.property('ccTweakedVersion')}"
    compileOnly "cc.tweaked:cc-tweaked-${project.property('ccTweakedMcBranch')}-forge-api:${project.property('ccTweakedVersion')}"

    // ...but the full mod jar goes on the DEV RUNTIME classpath, exactly as
    // Mekanism does below. Without this, ModList.get().isLoaded("computercraft")
    // is false in every run, BwrMod never registers BwrPeripheralSupport, and the
    // peripheral surface — which is the entire control interface of this mod —
    // is never once constructed. runtimeOnly is not a publishing configuration:
    // it affects run* tasks only and puts nothing in the jar, so the CCPL
    // position is unchanged. Verified after every build by tools-check-jar.py.
    //
    // CC:Tweaked is a SOFT dependency. Run any run* task with -PbwrNoCC to drop
    // it and prove the CC-less path still boots.
    if (!project.hasProperty('bwrNoCC')) {
        runtimeOnly "cc.tweaked:cc-tweaked-${project.property('ccTweakedMcBranch')}-forge:${project.property('ccTweakedVersion')}"
    }

    // Mekanism (MIT). Compile against the api classifier only; the full jar goes
    // on the dev runtime so integration can actually be exercised in-game.
    // Not bundled — players install Mekanism themselves.
    // The @jar suffix is required: modmaven publishes these jars with no POM,
    // so Gradle must be told to fetch the artifact directly and not look for
    // module metadata it will never find.
    compileOnly "mekanism:Mekanism:${project.property('mekanismVersion')}:api@jar"
    // Mekanism is a SOFT dependency: the mod must load and run with it absent.
    // Run any of the run* tasks with -PbwrNoMekanism to leave it off the runtime
    // classpath and prove that. Everything Mekanism-facing is guarded behind
    // ModList.get().isLoaded("mekanism") in dev.bwr.mod.BwrMod, so a Mekanism-less
    // JVM never resolves a single mekanism.* type.
    if (!project.hasProperty('bwrNoMekanism')) {
        runtimeOnly "mekanism:Mekanism:${project.property('mekanismVersion')}@jar"
        // Tritium is registered by Generators. Dev runtime only; never bundled or required by BWR.
        if (!project.hasProperty('bwrNoMekanismGenerators')) {
            runtimeOnly "mekanism:Mekanism:${project.property('mekanismVersion')}:generators@jar"
        }
    }
}

// ---------------------------------------------------------------------------
// OPTIONAL RENDER MODS (Sodium + Iris + a shader pack), RUN-ONLY.
//
//   -PbwrRenderMods=stable|newest   put that Sodium/Iris pair in the client run's mods/
//   -PbwrShaderPack=<zip name>|none  start with that pack from shaderpacks/ enabled in config/iris.properties
//   -PbwrRenderModsDir=<path>        folder holding stable/, newest/ and shaderpacks/
//                                    (default: ../optional-client-mods next to the repo)
//
// They are copied into the RUN directory only, never into the repo, never into the jar, never declared in
// neoforge.mods.toml and never on a compile classpath. Without -PbwrRenderMods every client run first deletes any
// Sodium/Iris jar, their config files and the shader pack copy an earlier run left behind, so a plain run can never
// silently keep Sodium. See TESTING.md ("Sodium, Iris and shader packs").
// ---------------------------------------------------------------------------
def renderModsMode = project.findProperty('bwrRenderMods')?.toString()
def shaderPackName = project.findProperty('bwrShaderPack')?.toString()
def renderModsDir = project.hasProperty('bwrRenderModsDir')
        ? file(project.property('bwrRenderModsDir').toString())
        : rootProject.file('../optional-client-mods')
if (renderModsMode != null && !(renderModsMode in ['stable', 'newest', 'none'])) {
    throw new GradleException("-PbwrRenderMods must be stable, newest or none, not '${renderModsMode}'")
}
if (shaderPackName in ['none', '']) shaderPackName = null
if (shaderPackName != null && (renderModsMode == null || renderModsMode == 'none')) {
    throw new GradleException('-PbwrShaderPack needs -PbwrRenderMods=stable|newest (shaders need Iris)')
}

// Every run that opens a client window (task name, run name). The multiplayer clients are added with their runs.
def clientRunNames = ['client', 'refuellingCheck', 'reactorFitCheck', 'advancementClientCheck', 'soundClientCheck',
                      'turbineModelCheck', 'mpClientA', 'mpClientB']

def prepareRenderMods = { File gameDir ->
    def modsFolder = new File(gameDir, 'mods')
    def configFolder = new File(gameDir, 'config')
    def packsFolder = new File(gameDir, 'shaderpacks')
    // 1. Remove everything an earlier run may have left behind.
    if (modsFolder.isDirectory()) modsFolder.listFiles().each { f ->
        def n = f.name.toLowerCase()
        if (f.isFile() && (n.startsWith('sodium') || n.startsWith('iris'))) f.delete()
    }
    ['iris.properties', 'iris-excluded.json', 'sodium-options.json', 'sodium-mixins.properties'].each {
        new File(configFolder, it).delete()
    }
    if (packsFolder.isDirectory()) packsFolder.listFiles().each { f ->
        if (f.isFile() && f.name.toLowerCase().endsWith('.zip')) f.delete()
    }
    if (renderModsMode == null || renderModsMode == 'none') {
        logger.lifecycle("render mods: none (run ${gameDir.name}: any earlier Sodium/Iris jars, configs and packs removed)")
        return
    }
    // 2. Copy the requested pair.
    def pairDir = new File(renderModsDir, renderModsMode)
    def jars = pairDir.isDirectory() ? pairDir.listFiles().findAll { it.name.endsWith('.jar') } : []
    if (!jars.any { it.name.startsWith('sodium') } || !jars.any { it.name.startsWith('iris') }) {
        throw new GradleException("No sodium*.jar and iris*.jar in ${pairDir} (see -PbwrRenderModsDir)")
    }
    modsFolder.mkdirs()
    jars.each { jar ->
        java.nio.file.Files.copy(jar.toPath(), new File(modsFolder, jar.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    // 3. The pack, and Iris's own config so the pack is on from the first frame.
    configFolder.mkdirs()
    def props = new Properties()
    if (shaderPackName != null) {
        def zip = new File(renderModsDir, "shaderpacks/${shaderPackName}")
        if (!zip.isFile()) throw new GradleException("Shader pack not found: ${zip}")
        packsFolder.mkdirs()
        java.nio.file.Files.copy(zip.toPath(), new File(packsFolder, zip.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        props.setProperty('enableShaders', 'true')
        props.setProperty('shaderPack', zip.name)
    } else {
        props.setProperty('enableShaders', 'false')
    }
    new File(configFolder, 'iris.properties').withOutputStream { props.store(it, 'written by mod/build.gradle (bwrRenderMods)') }
    // Diagnostics: -PbwrSodiumDisable=features.render.gui.font,features.render.immediate.buffer_builder.intrinsics switches
    // those Sodium mixin groups off (config/sodium-mixins.properties), to tell a Sodium optimisation from a mod defect.
    def disabled = project.findProperty('bwrSodiumDisable')?.toString()
    if (disabled) {
        def mixinProps = new Properties()
        disabled.split(',').each { mixinProps.setProperty('mixin.' + it.trim(), 'false') }
        new File(configFolder, 'sodium-mixins.properties').withOutputStream { mixinProps.store(it, 'written by mod/build.gradle (bwrSodiumDisable)') }
    }
    logger.lifecycle("render mods: ${renderModsMode} pair ${jars.collect { it.name }.sort()} pack=${shaderPackName ?: 'none'} (run ${gameDir.name})")
}

clientRunNames.each { runName ->
    tasks.matching { it.name == 'run' + runName.capitalize() }.configureEach { task ->
        task.doFirst {
            prepareRenderMods(neoForge.runs.getByName(runName).gameDirectory.get().asFile)
        }
    }
}

// ---------------------------------------------------------------------------
// :mod:runServerBootCheck [-PbwrNoCC] boots a real dedicated server (fresh flat world, offline, port 25598), waits for
// "Done", lets 200 ticks run (dev.bwr.mod.devtest.ServerBootCheck) and stops it. Afterwards this block fails the build
// when: "Done" or the stop line is missing; the log has an ERROR from dev.bwr / the mod's logger, or any
// NoClassDefFoundError / ClassNotFoundException / Missing registry / client-class text; or the JVM's class-load log shows a
// client class loaded (net.minecraft.client, blaze3d, neoforge.client, any dev.bwr ...client package). WARN lines from
// the mod are printed but do not fail the build. Logs: mod/run/serverBootCheck/logs/latest.log and
// mod/run/serverBootCheck-classload.log.
// ---------------------------------------------------------------------------
tasks.matching { it.name == 'runServerBootCheck' }.configureEach { task ->
    task.doFirst {
        def dir = neoForge.runs.getByName('serverBootCheck').gameDirectory.get().asFile
        project.delete(dir, file('run/serverBootCheck-classload.log'))
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true' + System.lineSeparator()
        new File(dir, 'server.properties').text = [
                'online-mode=false', 'server-ip=127.0.0.1', 'server-port=25598', 'level-type=minecraft\\:flat',
                'generator-settings={"layers":[{"block":"minecraft:bedrock","height":1}],"biome":"minecraft:plains","structure_overrides":[]}',
                'generate-structures=false', 'spawn-monsters=false', 'spawn-animals=false', 'spawn-npcs=false',
                'view-distance=4', 'simulation-distance=4', 'max-tick-time=-1', 'motd=BWR server boot check'].join(System.lineSeparator()) + System.lineSeparator()
    }
    task.doLast {
        def dir = neoForge.runs.getByName('serverBootCheck').gameDirectory.get().asFile
        def logFile = new File(dir, 'logs/latest.log')
        def problems = []
        if (!logFile.isFile()) throw new GradleException("serverBootCheck: no ${logFile}")
        def lines = logFile.readLines('UTF-8')
        if (!lines.any { it.contains('Done (') }) problems << 'the server never printed "Done"'
        if (!lines.any { it.contains('BWR SERVER BOOT CHECK: 200 ticks ran, stopping') }) problems << 'the 200-tick stop line is missing'
        def sweep = lines.find { it.contains('BWR SERVER BOOT CHECK: link sweep') }
        if (sweep == null) problems << 'the link sweep line is missing'
        else {
            logger.lifecycle('serverBootCheck: ' + sweep.substring(sweep.indexOf('BWR SERVER')))
            if (!sweep.contains(', 0 failed')) problems << 'link sweep failures: ' + sweep.trim()
        }
        def badText = ~/NoClassDefFoundError|ClassNotFoundException|Missing registry|net\.minecraft\.client|com\.mojang\.blaze3d|neoforge\.client\.|IncompatibleClassChangeError|Exception in thread/
        def ours = ~/dev\.bwr|\[bwr\]|\[BWR|bwr\//
        lines.each { l ->
            if (l.contains('/ERROR]') && (l =~ ours || l =~ badText)) problems << 'ERROR: ' + l.trim()
            else if (l =~ badText && !l.contains('LanServerPinger')) problems << 'bad text: ' + l.trim()
            else if (l.contains('/WARN]') && (l =~ ours)) logger.lifecycle('serverBootCheck WARN (not failing): ' + l.trim())
        }
        // Loaded on a server by design: vanilla's DedicatedServer and NeoForge's own common types live in these packages, and the
        // dev.bwr ones sit in a client package by name but import nothing client-side (a ModConfigSpec and pure geometry).
        def allowedClientClasses = ['net.minecraft.client.server.LanServerPinger',
                'net.neoforged.neoforge.client.loading.NoVizFallback',
                'net.neoforged.neoforge.client.extensions.IMenuProviderExtension',
                'net.neoforged.neoforge.client.model.data.ModelProperty',
                'dev.bwr.mod.client.VisualEffectsConfig', 'dev.bwr.mod.client.VisualEffectsConfig$Mode',
                'dev.bwr.mod.panel.client.QuadSink', 'dev.bwr.mod.panel.client.BarGaugeFace'] as Set
        def loadFile = file('run/serverBootCheck-classload.log')
        if (!loadFile.isFile()) problems << 'no class-load log'
        else {
            def seen = new LinkedHashSet()
            loadFile.eachLine('UTF-8') { l ->
                def m = l =~ /\]\[info\]\[class,load\]\s+(\S+)\s+source:/
                if (m.find()) {
                    def c = m.group(1)
                    if (c =~ /^(net\.minecraft\.client\.|com\.mojang\.blaze3d\.|net\.neoforged\.neoforge\.client\.|dev\.bwr\.[\w.]*\.?client\.)/ && !allowedClientClasses.contains(c)) seen << c
                }
            }
            seen.take(40).each { problems << 'client class loaded on the server: ' + it }
            logger.lifecycle("serverBootCheck: class-load log scanned, ${seen.size()} client classes loaded")
        }
        if (problems) throw new GradleException('serverBootCheck FAILED:' + System.lineSeparator() + '  ' + problems.unique().take(60).join(System.lineSeparator() + '  '))
        logger.lifecycle('serverBootCheck: PASS (Done reached, 200 ticks, clean stop, no client classes, no mod errors)')
    }
}

