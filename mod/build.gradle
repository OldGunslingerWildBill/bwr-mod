// ---------------------------------------------------------------------------
// THE NON-NEGOTIABLE DESIGN RULE, enforced by the build.
//
// The mod provides hardware and physics; the player provides control logic.
// No scram logic, no trip setpoints, no automatic ECCS actuation, no protection
// system, anywhere. Players write all of it in CC:Tweaked Lua from scratch.
// Expose MEASUREMENTS and ACTUATORS, never judgements.
//
// :core already enforces this by reflection in
// dev.bwr.core.ReactorCoreTickTest.test07_noProtectionLogicAnywhereInThePhysics,
// which scans every method on the physics classes. That test cannot see this
// module -- :mod has no test source set, and giving it one would mean standing
// up the whole Minecraft classpath just to read method names. So this module is
// checked at the source level instead: comments are stripped, then any surviving
// mention of a banned name is a failure whether it is a declaration or a call.
//
// Javadoc that PROHIBITS such a method is fine and is expected to stay -- that
// is why comments are stripped before scanning rather than after.
// ---------------------------------------------------------------------------
tasks.register('checkNoProtectionLogic') {
    group = 'verification'
    description = 'Fail the build if any protection-system logic appears in :mod.'

    def javaDir = file('src/main/java')
    inputs.dir javaDir
    // No real output; this marker just lets Gradle cache a clean result.
    def marker = layout.buildDirectory.file('checkNoProtectionLogic.txt')
    outputs.file marker

    doLast {
        // Names that assert a judgement the player is supposed to own.
        def banned = [
                'shouldScram', 'autoScram', 'checkTrip', 'checkTrips',
                'isSafe', 'isUnsafe', 'isHighPressure', 'isLowLevel',
                'autoStart', 'mustScram', 'needsScram', 'scramIfNeeded',
                'tripOnHighPressure', 'protectionSystem',
        ]
        def pattern = ~/\b(${banned.join('|')})\s*\(/

        def violations = []
        int scanned = 0
        javaDir.eachFileRecurse { f ->
            if (!f.name.endsWith('.java')) return
            scanned++
            def src = f.text
            // Strip block comments, then line comments. Javadoc that forbids
            // these names is documentation, not behaviour.
            def code = src.replaceAll(/(?s)\/\*.*?\*\//, '')
                          .replaceAll(/\/\/[^\n]*/, '')
            code.eachLine { line, i ->
                def m = pattern.matcher(line)
                while (m.find()) {
                    violations << "${f.name}: ${m.group(1)}(  --  ${line.trim()}"
                }
            }
        }

        marker.get().asFile.parentFile.mkdirs()
        marker.get().asFile.text = "scanned ${scanned} files, ${violations.size()} violations\n"

        if (violations) {
            throw new GradleException(
                    "Protection logic found in :mod. The mod provides hardware and\n" +
                    "physics; the player provides control logic. Expose measurements\n" +
                    "and actuators, never judgements.\n\n  " +
                    violations.join('\n  '))
        }
        logger.lifecycle("checkNoProtectionLogic: scanned ${scanned} files in :mod, no protection logic present")
    }
}

tasks.named('check') {
    dependsOn 'checkNoProtectionLogic'
}
