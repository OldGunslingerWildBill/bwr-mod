org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# Project
group=dev.bwr
version=0.1.0-alpha.10
modId=bwr
modName=Realistic BWR
modLicense=LicenseRef-Realistic-BWR-Source-Available-1.0

# Toolchain / platform
javaVersion=21
minecraftVersion=1.21.1
neoforgeVersion=21.1.248
moddevgradleVersion=2.0.143

# Integrations
# CC:Tweaked API is compileOnly and MUST NOT be bundled — parts of the API
# (notably IPeripheral.java) remain under LicenseRef-CCPL, which permits
# redistribution only "unmodified and in full". Players install CC:Tweaked themselves.
#
# The full (non-api) jar IS put on the dev runtime classpath so the peripheral
# actually gets constructed in a real game; see mod/build.gradle. runtimeOnly is
# never packaged, so the licence position is unchanged.
#
# Branch is 1.21.1, not 1.21: the 1.21 artifacts (the newest on the old
# squiddev.cc/maven host, 1.111.0) declare neoforge versionRange
# "[21.0.21-beta,21.1)" and FML hard-refuses to load them against the 21.1.248
# we pin. The 1.21.1 artifacts live on maven.squiddev.cc and declare
# "[21.1.9,21.2)", which 21.1.248 satisfies.
ccTweakedVersion=1.120.2
ccTweakedMcBranch=1.21.1

# Mekanism is a SOFT runtime dependency (MIT licensed), not a hard one. It is
# declared type = "optional" in neoforge.mods.toml, it is compileOnly +
# runtimeOnly in mod/build.gradle, and it is never bundled; the mod loads and
# runs correctly without it (HANDOFF.md section 4, verified by
# `gradle :mod:runData -PbwrNoMekanism`). SPEC 2.4's "makes Mekanism a hard
# dependency" was a design-time note that the implementation deliberately did
# not follow: both Mekanism boundaries degrade honestly instead. Do not
# re-tighten this to "required" without reading that section.
#
# This exact version is also what tools-audit-assets.py opens out of the Gradle
# cache to confirm that the `mekanism:` item ids our recipes name actually
# exist. An unknown item id makes RecipeManager drop the whole recipe at
# datapack load, which is how `mekanism:pellet_fissile_fuel` (an id that has
# never existed in 10.7) silently deleted the only crafting route to a fuel
# assembly. Bumping this line re-runs that check against the new jar.
mekanismVersion=1.21.1-10.7.19.85
