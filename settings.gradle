pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'bwr'

// core/ is pure Java with zero Minecraft on its classpath. That is enforced
// structurally here, not by discipline: the module simply cannot see NeoForge.
include 'core'
include 'mod'
